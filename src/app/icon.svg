<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rachar">
  <!--
    A marca é o próprio nome: um disco rachado ao meio, com as duas metades
    separadas e desencontradas. Lê-se como "dividir" e como uma moeda partida
    em duas, que é o que a app faz.

    Desenhado para o tamanho pequeno: o corte é largo de propósito, porque a
    16 pixels um traço fino desaparece.
  -->
  <rect width="512" height="512" rx="116" fill="#0d0d10"/>
  <g fill="#f3f2ee">
    <path d="M240 106a150 150 0 0 0 0 300Z" transform="translate(-14 -16)"/>
    <path d="M272 106a150 150 0 0 1 0 300Z" transform="translate(14 16)"/>
  </g>
</svg>
